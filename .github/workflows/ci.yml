name: Qovrion CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: qovrion-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run hot-path security guard
        shell: bash
        run: |
          set -euo pipefail
          semgrep --config .semgrep/rules/no-bracket-assign-hot-paths.yml \
            --strict --json \
            src/providers/ src/parser.ts > semgrep-out.json
          findings="$(jq '.results | length' semgrep-out.json)"
          if [ "$findings" -gt 0 ]; then
            jq -r '.results[] | "::error file=\(.path),line=\(.start.line)::\(.extra.message)"' semgrep-out.json
            exit 1
          fi

  build:
    name: Core build and desktop validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install core dependencies
        run: npm ci --no-audit --no-fund
      - name: Build CLI
        run: npm run build:cli
      - name: Install desktop dependencies
        run: npm --prefix app ci --no-audit --no-fund
      - name: Test desktop
        run: npm --prefix app test
      - name: Typecheck desktop
        run: npm --prefix app run typecheck
      - name: Build desktop
        run: npm --prefix app run build

  full-suite:
    name: Full core test suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete core suite deterministically
        # Root tests mutate process-wide HOME/config and filesystem fixtures.
        # Desktop tests have their own blocking cross-platform job above; do not
        # execute them a second time under the root package's ESM boundary.
        run: npm test -- --run --no-file-parallelism --exclude 'app/**'
      - name: Record blocking status
        shell: bash
        run: |
          {
            echo "## Full core test suite"
            echo
            echo "Outcome: \`success\`"
            echo
            echo "The complete core suite ran serially as a blocking merge gate. Desktop tests ran separately on Ubuntu and Windows."
          } >> "$GITHUB_STEP_SUMMARY"
