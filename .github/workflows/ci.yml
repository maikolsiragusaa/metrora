name: Metrora CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: metrora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run hot-path security guard
        shell: bash
        run: |
          set -euo pipefail
          semgrep --config .semgrep/rules/no-bracket-assign-hot-paths.yml \
            --strict --json \
            src/providers/ src/parser.ts > semgrep-out.json
          findings="$(jq '.results | length' semgrep-out.json)"
          if [ "$findings" -gt 0 ]; then
            jq -r '.results[] | "::error file=\(.path),line=\(.start.line)::\(.extra.message)"' semgrep-out.json
            exit 1
          fi

  build:
    name: Core build and desktop validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
      - name: Require Node zstd support
        run: node -e "if (typeof require('node:zlib').zstdDecompressSync !== 'function') throw new Error('Node zstd support is required by the Zed gate')"
      - name: Install core dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate historical price book and generated docs
        run: npm run pricing:docs:check
      - name: Test historical pricing, settlement, and assignment contracts
        run: >-
          npm test -- --run --no-file-parallelism
          src/pricing/history.test.ts
          src/pricing/historical-cost.test.ts
          src/pricing/historical-cost-coverage.test.ts
          src/pricing/gpt-5-6-history.test.ts
          src/pricing/local-observation-ledger.test.ts
          src/pricing/local-observation-bands.test.ts
          src/pricing/cost-assignment.test.ts
          src/pricing/settled-historical-cost.test.ts
      - name: Test reviewed production receipt semantics
        run: npm test -- --run --no-file-parallelism src/local-state/measurement-production-receipt.test.ts
      - name: Build CLI and desktop local-state runtime
        run: npm run build:cli
      - name: Test Zed SQLite and zstd collector
        run: npm test -- --run --no-file-parallelism tests/providers/zed.test.ts
      - name: Test refresh lock lease on Windows
        if: runner.os == 'Windows'
        run: npm test -- --run --no-file-parallelism tests/cache-refresh-lock.test.ts
      - name: Test local endpoint, workspace, reviewed production, outbox, signed batches, exports, and desktop runtime on Windows
        if: runner.os == 'Windows'
        run: >-
          npm test -- --run --no-file-parallelism
          src/vendor/rfc8785-canonicalize.test.ts
          src/local-state/secret-protector.test.ts
          src/local-state/endpoint-identity.test.ts
          src/local-state/local-workspace.test.ts
          src/local-state/reviewed-measurement-producer.test.ts
          src/local-state/measurement-production-receipt.test.ts
          src/local-state/desktop-host.test.ts
          src/local-state/desktop-workspace-runtime.test.ts
          src/local-state/measurement-outbox.test.ts
          src/local-state/signed-batch.test.ts
          src/local-state/workspace-evidence.test.ts
      - name: Install desktop dependencies
        run: npm --prefix app ci --no-audit --no-fund
      - name: Stage desktop runtime
        run: npm --prefix app run stage-cli
      - name: Probe Electron safeStorage with Windows DPAPI
        if: runner.os == 'Windows'
        run: npm --prefix app run test:safe-storage
      - name: Test desktop
        run: npm --prefix app test
      - name: Typecheck desktop
        run: npm --prefix app run typecheck
      - name: Build desktop
        run: npm --prefix app run build

  full-suite:
    name: Full core test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
      - name: Require Node zstd support
        run: node -e "if (typeof require('node:zlib').zstdDecompressSync !== 'function') throw new Error('Node zstd support is required by the Zed gate')"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run ordinary core files deterministically
        # Root tests mutate process-wide HOME/config and filesystem fixtures.
        # Desktop tests have their own blocking cross-platform job above.
        # Three files with named inherited quarantines are executed separately
        # below so every other test in those files remains blocking.
        shell: bash
        run: |
          set +e
          npm test -- --run --no-file-parallelism \
            --reporter=json --outputFile=vitest-ordinary.json \
            --exclude 'app/**' \
            --exclude 'tests/parser.test.ts' \
            --exclude 'tests/parser-incremental-append.test.ts' \
            --exclude 'tests/cli-durable-totals.test.ts'
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('vitest-ordinary.json', 'utf8'))
          const failed = []
          for (const file of report.testResults ?? []) {
            const assertions = file.assertionResults ?? []
            for (const assertion of assertions) {
              if (assertion.status !== 'failed') continue
              failed.push({
                file: file.name ?? file.testFilePath ?? 'unknown file',
                test: [...(assertion.ancestorTitles ?? []), assertion.title].filter(Boolean).join(' > '),
                messages: assertion.failureMessages ?? [],
              })
            }
          }
          console.error(`Ordinary core gate failed: ${report.numFailedTestSuites ?? '?'} suite(s), ${report.numFailedTests ?? failed.length} test(s).`)
          for (const item of failed) {
            console.error(`\nFILE: ${item.file}\nTEST: ${item.test}`)
            for (const message of item.messages) console.error(message)
          }
          if (failed.length === 0) console.error('No failed assertion was present in the JSON report.')
          NODE
            exit "$status"
          fi
      - name: Run non-quarantined durable parser tests
        run: >-
          npm test -- --run --no-file-parallelism tests/parser.test.ts
          -t "^(?!.*preserves monthly total after events\\.jsonl is deleted)(?!.*keeps counting a pruned-source orphan after the provider fingerprint changes).*$"
      - name: Run non-quarantined incremental parser tests
        run: >-
          npm test -- --run --no-file-parallelism tests/parser-incremental-append.test.ts
          -t "^(?!.*EDGE: file replaced \\(inode change\\) falls back to a full re-parse).*$"
      - name: Run non-quarantined durable totals tests
        run: >-
          npm test -- --run --no-file-parallelism tests/cli-durable-totals.test.ts
          -t "^(?!.*resolves provider filters identically on both paths, slicing the carried day per provider).*$"
      - name: Record blocking status and quarantine
        shell: bash
        run: |
          {
            echo "## Full core test suite"
            echo
            echo "Outcome: \`success\`"
            echo
            echo "All non-quarantined core tests ran serially as blocking gates. Desktop tests ran separately on Ubuntu and Windows."
            echo
            echo "The Zed SQLite/zstd collector ran as an explicit blocking gate on Node 22.15 on Ubuntu and Windows."
            echo
            echo "The reviewed GPT-5.6 intervals, historical calculations, immutable cost assignments, local observation ledger, cross-book resolution and generated documentation ran as explicit blocking gates on Ubuntu and Windows."
            echo
            echo "Reviewed production-receipt semantics ran explicitly on Ubuntu and Windows."
            echo
            echo "The refresh-lock lease, local endpoint/workspace state, reviewed measurement production, signed evidence, private desktop Workspace runtime, public-only IPC bridge, and real Electron DPAPI probe also ran on Windows."
            echo
            echo "Four exact inherited cases remain quarantined in \`docs/TEST_QUARANTINE.md\`; no wildcard file or subsystem quarantine is active."
          } >> "$GITHUB_STEP_SUMMARY"