name: One-time Metrora brand migration

on:
  push:
    branches:
      - feat/brand-rollout-v1
    paths:
      - .github/workflows/brand-rollout-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/brand-rollout-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source and raster migration
        run: |
          node scripts/apply-brand-source-patches.mjs
          rm scripts/apply-brand-source-patches.mjs
          rm .github/workflows/brand-rollout-once.yml
      - name: Commit clean result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "brand: finish Metrora product surface rollout"
          git push origin HEAD:feat/brand-rollout-v1
