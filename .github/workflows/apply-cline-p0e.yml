name: Apply bounded Cline storage remediation

on:
  push:
    branches: [fix/cline-vscode-storage-variants]

permissions:
  contents: write

concurrency:
  group: apply-cline-p0e
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cline-vscode-storage-variants
          fetch-depth: 0

      - name: Apply exact production, test, and documentation delta
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/providers/cline.ts',
              "import { discoverClineTasks, createClineParser, getVSCodeGlobalStoragePath } from './vscode-cline-parser.js'",
              "import { discoverClineTasks, createClineParser, getVSCodeGlobalStoragePaths } from './vscode-cline-parser.js'",
          )
          replace_once(
              'src/providers/cline.ts',
              '// Cline has two default roots, so tests and future callers can override one or both.',
              '// Cline has several default roots, so tests and future callers can override one or all.',
          )
          replace_once(
              'src/providers/cline.ts',
              """      const baseDirs = configuredDirs ?? [
                getVSCodeGlobalStoragePath(EXTENSION_ID),
                getClineDataPath(),
              ]

              const sources = await Promise.all(
                baseDirs.map(dir => discoverClineTasks(EXTENSION_ID, 'cline', 'Cline', dir)),
              )

              return dedupeTaskSources(sources.flat())
          """,
              """      // Cline may be installed in stable VS Code, Insiders, or VSCodium.
              // Scan each variant plus Cline's own home-data root, then select one
              // newest source per task id before parsing.
              const baseDirs = configuredDirs ?? [
                ...getVSCodeGlobalStoragePaths(EXTENSION_ID),
                getClineDataPath(),
              ]

              return dedupeTaskSources(await discoverClineTasks(EXTENSION_ID, 'cline', 'Cline', baseDirs))
          """,
          )

          replace_once(
              'src/session-cache.ts',
              "cline: 'worktree-project-grouping-v1',",
              "cline: 'worktree-project-grouping-v1-vscode-variants-v1',",
          )

          replace_once(
              'src/usage-aggregator.ts',
              """import { runtimeHistoricalPricingCacheKeyV1 } from './pricing/runtime-cost-assignment.js'
          import { buildGranularHistory } from './granular-history.js'

          // Row caps""",
              """import { runtimeHistoricalPricingCacheKeyV1 } from './pricing/runtime-cost-assignment.js'
          import { PROVIDER_PARSE_VERSIONS } from './session-cache.js'
          import { buildGranularHistory } from './granular-history.js'
          // Row caps""",
          )
          replace_once(
              'src/usage-aggregator.ts',
              "return `historicalPricing=${runtimeHistoricalPricingCacheKeyV1()}\\u0002${accountingHash}`",
              "return `historicalPricing=${runtimeHistoricalPricingCacheKeyV1()}\\u0002clineCollector=${PROVIDER_PARSE_VERSIONS['cline'] ?? ''}\\u0002${accountingHash}`",
          )

          replace_once(
              'tests/providers/cline.test.ts',
              "import { cline, createClineProvider } from '../../src/providers/cline.js'",
              "import { cline, createClineProvider, getClineDataPath } from '../../src/providers/cline.js'\nimport { getVSCodeGlobalStoragePaths } from '../../src/providers/vscode-cline-parser.js'",
          )
          replace_once(
              'tests/providers/cline.test.ts',
              "let tmpDir: string",
              "const EXTENSION_ID = 'saoudrizwan.claude-dev'\n\nlet tmpDir: string",
          )
          default_roots_tests = r'''
          describe.sequential('cline provider - default roots', () => {
            let previousHome: string | undefined
            let previousUserProfile: string | undefined

            beforeEach(async () => {
              tmpDir = await mkdtemp(join(tmpdir(), 'cline-default-roots-test-'))
              previousHome = process.env['HOME']
              previousUserProfile = process.env['USERPROFILE']
              process.env['HOME'] = tmpDir
              process.env['USERPROFILE'] = tmpDir
            })

            afterEach(async () => {
              if (previousHome === undefined) delete process.env['HOME']
              else process.env['HOME'] = previousHome
              if (previousUserProfile === undefined) delete process.env['USERPROFILE']
              else process.env['USERPROFILE'] = previousUserProfile
              await rm(tmpDir, { recursive: true, force: true })
            })

            it('discovers tasks from stable VS Code, Insiders, and VSCodium', async () => {
              const roots = getVSCodeGlobalStoragePaths(EXTENSION_ID)
              expect(roots).toHaveLength(3)
              const [stableRoot, insidersRoot, codiumRoot] = roots
              await writeTask(stableRoot!, 'task-stable')
              await writeTask(insidersRoot!, 'task-insiders')
              await writeTask(codiumRoot!, 'task-codium')

              const sessions = await createClineProvider().discoverSessions()

              expect(sessions.map(session => session.path).sort()).toEqual([
                join(stableRoot!, 'tasks', 'task-stable'),
                join(insidersRoot!, 'tasks', 'task-insiders'),
                join(codiumRoot!, 'tasks', 'task-codium'),
              ].sort())
            })

            it('still scans the Cline home-data root alongside VS Code variants', async () => {
              const stableRoot = getVSCodeGlobalStoragePaths(EXTENSION_ID)[0]!
              const homeDataRoot = getClineDataPath()
              expect(homeDataRoot).toBe(join(tmpDir, '.cline', 'data'))
              await writeTask(stableRoot, 'task-vscode')
              await writeTask(homeDataRoot, 'task-home')

              const sessions = await createClineProvider().discoverSessions()

              expect(sessions.map(session => session.path).sort()).toEqual([
                join(stableRoot, 'tasks', 'task-vscode'),
                join(homeDataRoot, 'tasks', 'task-home'),
              ].sort())
            })

            it('keeps only the newest copy of a task id shared across variants', async () => {
              const [stableRoot, insidersRoot, codiumRoot] = getVSCodeGlobalStoragePaths(EXTENSION_ID)
              const stableTask = await writeTask(stableRoot!, 'task-same')
              const insidersTask = await writeTask(insidersRoot!, 'task-same')
              const codiumTask = await writeTask(codiumRoot!, 'task-same')
              await utimes(join(stableTask, 'ui_messages.json'), new Date('2026-01-01T00:00:00Z'), new Date('2026-01-01T00:00:00Z'))
              await utimes(join(codiumTask, 'ui_messages.json'), new Date('2026-02-01T00:00:00Z'), new Date('2026-02-01T00:00:00Z'))
              await utimes(join(insidersTask, 'ui_messages.json'), new Date('2026-03-01T00:00:00Z'), new Date('2026-03-01T00:00:00Z'))

              const sessions = await createClineProvider().discoverSessions()

              expect(sessions).toHaveLength(1)
              expect(sessions[0]!.path).toBe(insidersTask)
            })
          })

          '''
          replace_once(
              'tests/providers/cline.test.ts',
              "describe('cline provider - parsing', () => {",
              default_roots_tests + "describe('cline provider - parsing', () => {",
          )

          Path('tests/cline-discovery-cache-authority.test.ts').write_text(r'''import { createHash } from 'crypto'
          import { describe, expect, it } from 'vitest'

          import { computeEnvFingerprint, PROVIDER_PARSE_VERSIONS } from '../src/session-cache.js'
          import { getDailyCacheConfigHash } from '../src/usage-aggregator.js'

          function previousClineFingerprint(): string {
            return createHash('sha256')
              .update('parser=worktree-project-grouping-v1')
              .digest('hex')
              .slice(0, 16)
          }

          describe('Cline discovery cache authority', () => {
            it('invalidates the prior provider section and daily source-backed history', () => {
              expect(PROVIDER_PARSE_VERSIONS['cline']).toBe('worktree-project-grouping-v1-vscode-variants-v1')
              expect(computeEnvFingerprint('cline')).not.toBe(previousClineFingerprint())
              expect(getDailyCacheConfigHash()).toContain(
                `clineCollector=${PROVIDER_PARSE_VERSIONS['cline']}`,
              )
            })
          })
          '''.replace('          ', ''), encoding='utf-8')

          replace_once(
              'docs/providers/cline.md',
              """Two task roots are scanned:

          1. VS Code extension globalStorage for `saoudrizwan.claude-dev`.
          2. Cline's home-data root at `~/.cline/data`.

          Both roots are expected to contain a `tasks/` child directory. Discovery is delegated to `discoverClineTasks` in `src/providers/vscode-cline-parser.ts`, so a task is only included when it has a `ui_messages.json` file.""",
              """These task roots are scanned:

          1. VS Code extension globalStorage for `saoudrizwan.claude-dev` in stable VS Code, VS Code Insiders, and VSCodium. Platform paths come from `getVSCodeGlobalStoragePaths` in `src/providers/vscode-cline-parser.ts`.
          2. Cline's home-data root at `~/.cline/data`.

          Every root is expected to contain a `tasks/` child directory. Discovery is delegated to `discoverClineTasks` in `src/providers/vscode-cline-parser.ts`, so a task is only included when it has a `ui_messages.json` file.""",
          )
          replace_once(
              'docs/providers/cline.md',
              'Discovery deduplicates by task id across the two Cline roots so a migrated task is not scanned twice.',
              'Discovery deduplicates by task id across every Cline root so a migrated or replicated task is not scanned twice.',
          )
          replace_once(
              'docs/providers/cline.md',
              '- Cline can keep data in both VS Code globalStorage and `~/.cline/data`, depending on version and workflow.',
              '- Cline can keep data in VS Code stable, Insiders, VSCodium, and `~/.cline/data`, depending on version and workflow. All roots are scanned without summing duplicate task IDs.',
          )

          Path('.github/workflows/apply-cline-p0e.yml').unlink()
          PY

      - name: Commit bounded remediation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/apply-cline-p0e.yml \
            docs/providers/cline.md \
            src/providers/cline.ts \
            src/session-cache.ts \
            src/usage-aggregator.ts \
            tests/cline-discovery-cache-authority.test.ts \
            tests/providers/cline.test.ts
          git diff --cached --check
          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/apply-cline-p0e.yml',
              'docs/providers/cline.md',
              'src/providers/cline.ts',
              'src/session-cache.ts',
              'src/usage-aggregator.ts',
              'tests/cline-discovery-cache-authority.test.ts',
              'tests/providers/cline.test.ts',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected remediation delta: {sorted(actual)}')
          PY
          git commit -m 'fix(cline): discover every VS Code storage variant'
          git push origin HEAD:fix/cline-vscode-storage-variants
