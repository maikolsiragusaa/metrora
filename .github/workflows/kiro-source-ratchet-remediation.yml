name: Kiro source-ratchet remediation

on:
  push:
    branches: [fix/kiro-legacy-full-input]

permissions:
  contents: write

concurrency:
  group: kiro-source-ratchet-remediation
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kiro-legacy-full-input
          fetch-depth: 0

      - name: Restore zero-growth parser delta
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/providers/kiro.ts')
          text = source.read_text(encoding='utf-8')
          old = """  // Keep presentation and accounting separate: userMessage is only the latest
          // bounded preview, while inputChars covers every eligible human turn in the
          // legacy execution. Identity bootstrap text is not user prompt input.
          let pendingUserMessage = ''
          let inputChars = 0
          """
          new = "  let pendingUserMessage = '', inputChars = 0\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one accounting declaration block, found {text.count(old)}')
          source.write_text(text.replace(old, new), encoding='utf-8')

          workflow = Path('.github/workflows/kiro-source-ratchet-remediation.yml')
          workflow.unlink()
          PY

      - name: Commit bounded remediation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/providers/kiro.ts .github/workflows/kiro-source-ratchet-remediation.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/kiro-source-ratchet-remediation.yml\nsrc/providers/kiro.ts'
          git commit -m 'refactor(kiro): preserve provider source-size ratchet'
          git push origin HEAD:fix/kiro-legacy-full-input