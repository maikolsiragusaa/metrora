name: Android companion

on:
  pull_request:
    paths:
      - "android/**"
      - "docs/ANDROID_COMPANION_FOUNDATION.md"
      - ".github/workflows/android-companion.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "docs/ANDROID_COMPANION_FOUNDATION.md"
      - ".github/workflows/android-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qovrion-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint and package Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - uses: android-actions/setup-android@v3
      - name: Install Android API 37
        shell: bash
        run: sdkmanager "platforms;android-37"
      - name: Validate every distribution channel
        shell: bash
        run: >-
          gradle -p android --no-daemon --stacktrace
          :app:testGithubDebugUnitTest
          :app:lint
          :app:assembleGithubRelease
          :app:assembleFdroidRelease
          :app:bundlePlayRelease
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qovrion-android-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: warn
      - name: Upload unsigned packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qovrion-android-alpha
          path: |
            android/app/build/outputs/apk/github/release/*.apk
            android/app/build/outputs/apk/fdroid/release/*.apk
            android/app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
