name: Sanitize historical GitHub surfaces

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  sanitize:
    if: github.head_ref == 'maintenance/clean-history'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Sanitize closed issues
        shell: bash
        run: |
          set -euo pipefail
          while read -r number; do
            [ -n "$number" ] || continue
            while read -r comment_id; do
              [ -n "$comment_id" ] || continue
              gh api --method DELETE "/repos/${REPOSITORY}/issues/comments/${comment_id}" || true
            done < <(gh api --paginate "/repos/${REPOSITORY}/issues/${number}/comments?per_page=100" --jq '.[].id')
            gh api --method PATCH "/repos/${REPOSITORY}/issues/${number}" \
              -f title="Archived historical issue #${number}" \
              -f body='This closed item predates the current public baseline and is retained only as a historical reference.'
            gh api --method PUT "/repos/${REPOSITORY}/issues/${number}/lock" -f lock_reason=resolved || true
          done < <(
            gh api --paginate "/repos/${REPOSITORY}/issues?state=closed&per_page=100" \
              --jq '.[] | select(.pull_request == null) | .number'
          )

      - name: Sanitize historical pull requests
        shell: bash
        run: |
          set -euo pipefail
          while read -r number; do
            [ -n "$number" ] || continue
            [ "$number" = "$PR_NUMBER" ] && continue
            while read -r comment_id; do
              [ -n "$comment_id" ] || continue
              gh api --method DELETE "/repos/${REPOSITORY}/issues/comments/${comment_id}" || true
            done < <(gh api --paginate "/repos/${REPOSITORY}/issues/${number}/comments?per_page=100" --jq '.[].id')
            while read -r comment_id; do
              [ -n "$comment_id" ] || continue
              gh api --method DELETE "/repos/${REPOSITORY}/pulls/comments/${comment_id}" || true
            done < <(gh api --paginate "/repos/${REPOSITORY}/pulls/${number}/comments?per_page=100" --jq '.[].id')
            gh api --method PATCH "/repos/${REPOSITORY}/pulls/${number}" \
              -f title="Archived historical change #${number}" \
              -f body='This closed change predates the current public baseline and is retained only as a historical reference.' \
              -f state=closed
            gh api --method PUT "/repos/${REPOSITORY}/issues/${number}/lock" -f lock_reason=resolved || true
          done < <(gh api --paginate "/repos/${REPOSITORY}/pulls?state=all&per_page=100" --jq '.[].number')

      - name: Remove releases and tags
        shell: bash
        run: |
          set -euo pipefail
          while read -r release_id; do
            [ -n "$release_id" ] || continue
            gh api --method DELETE "/repos/${REPOSITORY}/releases/${release_id}" || true
          done < <(gh api --paginate "/repos/${REPOSITORY}/releases?per_page=100" --jq '.[].id')
          while read -r tag_ref; do
            [ -n "$tag_ref" ] || continue
            gh api --method DELETE "/repos/${REPOSITORY}/git/refs/${tag_ref}" || true
          done < <(
            gh api --paginate "/repos/${REPOSITORY}/git/matching-refs/tags/" \
              --jq '.[].ref | sub("^refs/"; "")'
          )

      - name: Close maintenance pull request
        if: always()
        shell: bash
        run: |
          gh api --method PATCH "/repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            -f title='Archived repository maintenance' \
            -f body='Temporary maintenance change used to prepare the current public baseline.' \
            -f state=closed || true
          gh api --method PUT "/repos/${REPOSITORY}/issues/${PR_NUMBER}/lock" -f lock_reason=resolved || true
