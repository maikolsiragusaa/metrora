name: One-time macOS brand migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'feat/brand-rollout-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/brand-rollout-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply macOS brand migration
        run: |
          node scripts/apply-macos-brand-patches.mjs
          rm scripts/apply-macos-brand-patches.mjs
          rm .github/workflows/macos-brand-rollout-once.yml
      - name: Commit clean result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "brand: finish macOS menubar rollout"
          git push origin HEAD:feat/brand-rollout-v1
