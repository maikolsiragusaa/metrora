name: Temporary UX1F model pricing patch trigger

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.event.pull_request.head.ref == 'fix/ux1f-model-pricing-state' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ux1f-model-pricing-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
      - name: Apply bounded patch from the temporary patch authority
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-ux1f-model-pricing-state.yml').read_text()
          marker = "python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          raw = workflow[start:end]
          script = raw[10:] if raw.startswith('          ') else raw
          script = script.replace('\n          ', '\n')

          original_helper = (
              "def replace_once(path: str, old: str, new: str) -> None:\n"
              "    file = Path(path)\n"
              "    text = file.read_text()\n"
              "    count = text.count(old)\n"
              "    if count != 1:\n"
              "        raise SystemExit(f'{path}: expected one match, found {count}')\n"
              "    file.write_text(text.replace(old, new, 1))\n"
          )
          scoped_helper = (
              "def replace_once(path: str, old: str, new: str) -> None:\n"
              "    file = Path(path)\n"
              "    text = file.read_text()\n"
              "    count = text.count(old)\n"
              "    known_duplicate = (path == 'app/renderer/sections/Models.test.tsx' and count == 2 and old == \\\"    savingsBaselineModel: 'Claude Opus 4.8',\\\\n    credits: null,\\\")\n"
              "    if count != 1 and not known_duplicate:\n"
              "        raise SystemExit(f'{path}: expected one match, found {count}')\n"
              "    file.write_text(text.replace(old, new, 1))\n"
          )
          if original_helper not in script:
              raise SystemExit('temporary patch helper contract changed unexpectedly')
          script = script.replace(original_helper, scoped_helper, 1)
          exec(compile(script, 'ux1f-model-pricing-patch.py', 'exec'))
          PY
      - name: Install and validate focused contracts
        run: |
          npm ci --no-audit --no-fund
          npm test -- --run --no-file-parallelism tests/model-pricing-summary.test.ts tests/models-report.test.ts
          npm run build:cli
          npm --prefix app ci --no-audit --no-fund
          npm --prefix app run stage-cli
          npm --prefix app test -- renderer/sections/Models.test.tsx renderer/sections/modelPricingPresentation.test.ts
          npm --prefix app run typecheck
          npm --prefix app run build
      - name: Validate architecture ratchet
        run: |
          git fetch origin main --depth=1
          SOURCE_SIZE_BASE_REF=origin/main node scripts/check-source-size-ratchet.mjs
      - name: Commit clean validated delta
        run: |
          rm .github/workflows/tmp-ux1f-model-pricing-state.yml
          rm .github/workflows/tmp-ux1f-model-pricing-trigger.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "[ux1f-model-pricing-applied] feat(models): preserve pricing evidence states"
          git push origin HEAD:fix/ux1f-model-pricing-state
