name: Apply model provider foundation

on:
  push:
    branches: [feat/model-provider-provenance-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/model-provider-provenance-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
      - name: Apply guarded replacements
        run: node scripts/apply-model-provider-foundation.mjs
      - name: Commit generated source changes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/providers/types.ts \
            src/types.ts \
            src/session-cache.ts \
            src/parser.ts \
            src/providers/zed.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "qovrion-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: preserve explicit model provider provenance"
          git push origin HEAD:feat/model-provider-provenance-v1
