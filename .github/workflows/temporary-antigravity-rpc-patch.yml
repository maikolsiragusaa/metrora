name: Temporary Antigravity RPC patch

on:
  push:
    branches:
      - fix/antigravity-rpc-rediscovery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified source patch
        shell: bash
        run: |
          set -euo pipefail
          patch_path=.github/temporary/antigravity-rpc-recovery.patch
          test -f "$patch_path"
          git apply --check "$patch_path"
          git apply "$patch_path"
          git diff --check
          rm -f "$patch_path" .github/workflows/temporary-antigravity-rpc-patch.yml
          rmdir .github/temporary 2>/dev/null || true

      - name: Commit final branch state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/providers/antigravity.ts .github
          git commit -m "fix(antigravity): recover restarted RPC endpoint"
          git push origin "HEAD:${GITHUB_REF_NAME}"
