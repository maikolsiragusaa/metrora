name: Kimi source-ratchet remediation

on:
  push:
    branches: [fix/kimi-context-tag-pricing]

permissions:
  contents: write

concurrency:
  group: kimi-source-ratchet-remediation
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kimi-context-tag-pricing
          fetch-depth: 0

      - name: Restore line-neutral models delta
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/models.ts')
          text = path.read_text(encoding='utf-8')

          old = "const ONE_HOUR_CACHE_WRITE_MULTIPLIER_FROM_FIVE_MINUTE_RATE = 1.6\nexport const PRICING_LOOKUP_VERSION = 'context-capacity-tags-v1'\n"
          new = "export const PRICING_LOOKUP_VERSION = 'context-capacity-tags-v1'; const ONE_HOUR_CACHE_WRITE_MULTIPLIER_FROM_FIVE_MINUTE_RATE = 1.6\n"
          if text.count(old) != 1:
              raise SystemExit('pricing constant compaction anchor mismatch')
          text = text.replace(old, new)

          old = "    .replace(/^[^/]+\\//, '') // strip provider prefix: anthropic/foo -> foo\n    .replace(/\\[(?:\\d+(?:\\.\\d+)?(?:k|m|g)?)\\]$/i, '') // strip numeric context tag: kimi/k3[1m] -> k3\n"
          new = "    .replace(/^[^/]+\\//, '').replace(/\\[(?:\\d+(?:\\.\\d+)?(?:k|m|g)?)\\]$/i, '') // provider prefix + numeric context tag\n"
          if text.count(old) != 1:
              raise SystemExit('canonicalization compaction anchor mismatch')
          path.write_text(text.replace(old, new), encoding='utf-8')

          Path('.github/workflows/kimi-source-ratchet-remediation.yml').unlink()
          PY

      - name: Commit bounded remediation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/models.ts .github/workflows/kimi-source-ratchet-remediation.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/kimi-source-ratchet-remediation.yml\nsrc/models.ts'
          git commit -m 'refactor(pricing): keep lookup delta line-neutral'
          git push origin HEAD:fix/kimi-context-tag-pricing