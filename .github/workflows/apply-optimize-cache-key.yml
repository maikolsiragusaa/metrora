name: Apply Optimize content cache key

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/optimize-content-cache-key
          fetch-depth: 0

      - name: Patch the oversized Optimize module exactly once
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/optimize.ts')
          text = path.read_text(encoding='utf-8')

          import_old = "import { aggregateFileChurn, buildCoachingNotes, scanUserCorrections, medianTimeToFirstEditMs, worstOneShotCategory, type ReworkedFile } from './workflow-insights.js'\n"
          import_new = import_old + "import { optimizeResultCacheKey } from './optimize-cache-key.js'\n"
          if text.count(import_old) != 1 or 'optimize-cache-key.js' in text:
              raise SystemExit('Optimize import authority changed unexpectedly')
          text = text.replace(import_old, import_new)

          block = """function cacheKey(projects: ProjectSummary[], dateRange: DateRange | undefined): string {
            const dr = dateRange ? `${dateRange.start.getTime()}-${dateRange.end.getTime()}` : 'all'
            const fingerprint = projects.length + ':' + projects.reduce((s, p) => s + p.totalApiCalls, 0)
            return `${dr}:${fingerprint}`
          }

          """
          if text.count(block) != 1:
              raise SystemExit(f'expected one legacy cache-key block, found {text.count(block)}')
          text = text.replace(block, '')

          call_old = '  const key = cacheKey(projects, dateRange)\n'
          call_new = '  const key = optimizeResultCacheKey(projects, dateRange)\n'
          if text.count(call_old) != 1:
              raise SystemExit(f'expected one legacy call site, found {text.count(call_old)}')
          text = text.replace(call_old, call_new)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/apply-optimize-cache-key.yml').unlink()
          PY

      - name: Commit exact integration delta
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-optimize-cache-key.yml src/optimize.ts
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/apply-optimize-cache-key.yml\nsrc/optimize.ts'
          git commit -m 'refactor(optimize): use content-addressed cache identity'
          git push origin HEAD:fix/optimize-content-cache-key
