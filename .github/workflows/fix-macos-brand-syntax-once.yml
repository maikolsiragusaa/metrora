name: One-time macOS brand syntax correction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/brand-rollout-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/brand-rollout-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct generated Swift source
        run: |
          node scripts/fix-macos-brand-syntax.mjs
          rm scripts/fix-macos-brand-syntax.mjs
          rm .github/workflows/fix-macos-brand-syntax-once.yml
      - name: Commit clean result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct Signal Grid loading mark syntax"
          git push origin HEAD:feat/brand-rollout-v1
