name: Restore Zed provenance boundary

on:
  push:
    branches: [fix/kimi-context-tag-pricing]

permissions:
  contents: write

concurrency:
  group: restore-zed-provenance-boundary
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kimi-context-tag-pricing
          fetch-depth: 0

      - name: Restore exact pre-existing Zed resolver
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/contracts/v1/collector-provenance.ts')
          text = path.read_text(encoding='utf-8')
          old = """  if (call.provider === 'zed') {
            if (call.isEstimated || !call.modelProvider || !call.deduplicationKey) return undefined
            return call.deduplicationKey.startsWith('zed:remainder:')
              ? ZED_CUMULATIVE_REMAINDER_PROFILE_V1
              : ZED_REQUEST_USAGE_PROFILE_V1
          }
          """
          new = """  if (call.provider === 'zed') {
            if (call.isEstimated || !call.modelProvider || !call.deduplicationKey) return undefined
            if (normalizeExplicitModelProvider(call.modelProvider) !== call.modelProvider) return undefined
            if (!call.deduplicationKey.startsWith('zed:')) return undefined
            return call.deduplicationKey.endsWith(':cumulative-remainder')
              ? ZED_CUMULATIVE_REMAINDER_PROFILE_V1
              : ZED_REQUEST_USAGE_PROFILE_V1
          }
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected one altered Zed resolver, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/restore-zed-provenance-boundary.yml').unlink()
          PY

      - name: Commit bounded restoration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/contracts/v1/collector-provenance.ts .github/workflows/restore-zed-provenance-boundary.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/restore-zed-provenance-boundary.yml\nsrc/contracts/v1/collector-provenance.ts'
          git commit -m 'fix(provenance): preserve Zed profile resolution'
          git push origin HEAD:fix/kimi-context-tag-pricing