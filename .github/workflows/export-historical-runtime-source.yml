name: Export historical runtime source

on:
  push:
    branches: [feat/historical-runtime-v8]
    paths:
      - '.github/workflows/export-historical-runtime-source.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-historical-runtime-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/historical-runtime-v8
      - uses: actions/upload-artifact@v4
        with:
          name: metrora-historical-runtime-source-${{ github.sha }}
          path: |
            src
            tests
            app
            scripts
            docs
            package.json
            package-lock.json
            tsconfig.json
            vitest.config.ts
            .github/workflows/ci.yml
          if-no-files-found: error
          compression-level: 6
          retention-days: 2
