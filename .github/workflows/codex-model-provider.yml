name: Codex model provider

on:
  pull_request:
    paths:
      - 'src/providers/codex-model-provider.ts'
      - 'src/providers/codex-model-provider.test.ts'
      - 'src/providers/index.ts'
      - 'src/local-state/canonical-reviewed-production-scanner.ts'
      - 'src/local-state/canonical-reviewed-production-scanner-codex.test.ts'
      - 'tests/providers/codex.test.ts'
      - 'docs/CODEX_MODEL_PROVIDER_V1.md'
      - '.github/workflows/codex-model-provider.yml'
  push:
    branches: [main]
    paths:
      - 'src/providers/codex-model-provider.ts'
      - 'src/providers/codex-model-provider.test.ts'
      - 'src/providers/index.ts'
      - 'src/local-state/canonical-reviewed-production-scanner.ts'
      - 'src/local-state/canonical-reviewed-production-scanner-codex.test.ts'
      - 'tests/providers/codex.test.ts'
      - 'docs/CODEX_MODEL_PROVIDER_V1.md'
      - '.github/workflows/codex-model-provider.yml'

permissions:
  contents: read

concurrency:
  group: codex-model-provider-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Explicit Codex provider (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build canonical runtime entries
        run: npm run build:cli
      - name: Run Codex provider, parser, and scanner gates
        run: >-
          npx vitest --run --no-file-parallelism --testTimeout=15000
          src/providers/codex-model-provider.test.ts
          src/local-state/canonical-reviewed-production-scanner-codex.test.ts
          src/local-state/canonical-reviewed-production-scanner.test.ts
          tests/providers/codex.test.ts
