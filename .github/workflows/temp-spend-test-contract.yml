name: Temporary Spend test contract fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/ux1f-spend-session-evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
      - name: Update the exact historical assertion
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/renderer/sections/Spend.test.tsx')
          old = "    expect(within(detail).getByText('claude-opus-4')).toBeInTheDocument()"
          new = "    expect(within(detail).getByLabelText('Models: claude-opus-4, claude-haiku-4')).toHaveTextContent('claude-opus-4 +1 more')"
          text = path.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one historical assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Validate focused Spend tests
        run: |
          npm --prefix app ci --no-audit --no-fund
          npm --prefix app test -- --run renderer/sections/Spend.test.tsx renderer/sections/SpendLegibility.test.tsx
      - name: Remove temporary workflow and push clean commit
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          rm .github/workflows/temp-spend-test-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/renderer/sections/Spend.test.tsx .github/workflows/temp-spend-test-contract.yml
          git commit -m "test(spend): assert compact multi-model evidence"
          git push origin "HEAD:${BRANCH}"
