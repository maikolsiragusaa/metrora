name: Kiro full-input construction

on:
  push:
    branches: [fix/kiro-legacy-full-input]

permissions:
  contents: write

concurrency:
  group: kiro-full-input-construction
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kiro-legacy-full-input
          fetch-depth: 0

      - name: Update Kiro parser cache authority
        run: |
          python - <<'PY'
          from pathlib import Path

          cache = Path('src/session-cache.ts')
          text = cache.read_text(encoding='utf-8')
          old = "  kiro: 'ide-parsing-v1-est-cost',"
          new = "  kiro: 'ide-parsing-v2-legacy-full-input-est-cost',"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Kiro parse-version authority, found {text.count(old)}')
          cache.write_text(text.replace(old, new), encoding='utf-8')

          workflow = Path('.github/workflows/kiro-full-input-construction.yml')
          workflow.unlink()
          PY

      - name: Commit bounded construction update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/session-cache.ts .github/workflows/kiro-full-input-construction.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/kiro-full-input-construction.yml\nsrc/session-cache.ts'
          git commit -m 'fix(kiro): invalidate stale legacy input caches'
          git push origin HEAD:fix/kiro-legacy-full-input