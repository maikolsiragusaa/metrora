name: Run reviewed Cline remediation payload

on:
  push:
    branches: [fix/cline-vscode-storage-variants]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cline-vscode-storage-variants
          fetch-depth: 0

      - name: Execute the reviewed payload
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-cline-p0e.yml')
          text = workflow.read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n\n      - name: Commit bounded remediation"
          if text.count(start) != 2 or text.count(end) != 1:
              raise SystemExit('reviewed payload markers changed unexpectedly')
          block = text.split(start, 1)[1].split(end, 1)[0]
          exec(compile(dedent(block), str(workflow), 'exec'), {})
          Path('.github/workflows/run-cline-p0e.yml').unlink()
          PY

      - name: Commit exact final delta
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/apply-cline-p0e.yml \
            .github/workflows/run-cline-p0e.yml \
            docs/providers/cline.md \
            src/providers/cline.ts \
            src/session-cache.ts \
            src/usage-aggregator.ts \
            tests/cline-discovery-cache-authority.test.ts \
            tests/providers/cline.test.ts
          git diff --cached --check
          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/apply-cline-p0e.yml',
              '.github/workflows/run-cline-p0e.yml',
              'docs/providers/cline.md',
              'src/providers/cline.ts',
              'src/session-cache.ts',
              'src/usage-aggregator.ts',
              'tests/cline-discovery-cache-authority.test.ts',
              'tests/providers/cline.test.ts',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected final delta: {sorted(actual)}')
          PY
          git commit -m 'fix(cline): discover every VS Code storage variant'
          git push origin HEAD:fix/cline-vscode-storage-variants
