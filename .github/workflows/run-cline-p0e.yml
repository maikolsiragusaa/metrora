name: Complete reviewed Cline remediation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  run:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cline-vscode-storage-variants
          fetch-depth: 0

      - name: Apply remaining cache authorities and remove helpers
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/session-cache.ts',
              "cline: 'worktree-project-grouping-v1',",
              "cline: 'worktree-project-grouping-v1-vscode-variants-v1',",
          )
          replace_once(
              'src/usage-aggregator.ts',
              """import { runtimeHistoricalPricingCacheKeyV1 } from './pricing/runtime-cost-assignment.js'
          import { buildGranularHistory } from './granular-history.js'

          // Row caps""",
              """import { runtimeHistoricalPricingCacheKeyV1 } from './pricing/runtime-cost-assignment.js'
          import { PROVIDER_PARSE_VERSIONS } from './session-cache.js'
          import { buildGranularHistory } from './granular-history.js'
          // Row caps""",
          )
          replace_once(
              'src/usage-aggregator.ts',
              "return `historicalPricing=${runtimeHistoricalPricingCacheKeyV1()}\\u0002${accountingHash}`",
              "return `historicalPricing=${runtimeHistoricalPricingCacheKeyV1()}\\u0002clineCollector=${PROVIDER_PARSE_VERSIONS['cline'] ?? ''}\\u0002${accountingHash}`",
          )
          Path('.github/workflows/apply-cline-p0e.yml').unlink()
          Path('.github/workflows/run-cline-p0e.yml').unlink()
          PY

      - name: Commit exact remaining delta
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/apply-cline-p0e.yml \
            .github/workflows/run-cline-p0e.yml \
            src/session-cache.ts \
            src/usage-aggregator.ts
          git diff --cached --check
          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/apply-cline-p0e.yml',
              '.github/workflows/run-cline-p0e.yml',
              'src/session-cache.ts',
              'src/usage-aggregator.ts',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected remaining delta: {sorted(actual)}')
          PY
          git commit -m 'fix(cache): reconcile broadened Cline discovery'
          git push origin HEAD:fix/cline-vscode-storage-variants
