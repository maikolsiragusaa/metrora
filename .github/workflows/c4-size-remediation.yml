name: C4 size remediation

on:
  push:
    branches:
      - fix/c4-project-filter-durable-reconciliation

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/c4-project-filter-durable-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
      - name: Restore frozen source-size baseline
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/daily-cache-core.ts')
          text = path.read_text(encoding='utf-8')
          old = """    // Object.entries exposes own enumerable keys only, and setOwn defines
              // them without invoking Object.prototype setters. Prototype-property
              // project names are safe data and must survive persistence + reload.
              if (!isRecord(p)) continue
          """
          new = """    if (!isRecord(p)) continue // Object.entries + setOwn safely preserve prototype-property names
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected one size-remediation target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run persistence regression
        run: npm test -- --run --no-file-parallelism tests/c4-review-remediation.test.ts
      - name: Build CLI
        run: npm run build:cli
      - name: Commit remediation and remove applicator
        shell: bash
        run: |
          rm .github/workflows/c4-size-remediation.yml
          git diff --check
          test "$(wc -l < src/daily-cache-core.ts)" -le 757
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/daily-cache-core.ts .github/workflows/c4-size-remediation.yml
          git commit -m "fix(c4): preserve the source-size baseline"
          git push origin HEAD:fix/c4-project-filter-durable-reconciliation
