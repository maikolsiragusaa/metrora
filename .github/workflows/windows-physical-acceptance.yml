name: Metrora Physical Acceptance Guard

on:
  pull_request:
    paths:
      - '.github/workflows/windows-physical-acceptance.yml'
      - 'AVVIA-TEST-FISICO-METRORA.cmd'
      - 'docs/WINDOWS_GITHUB_PRE_RELEASE_ACCEPTANCE_V1.md'
      - 'docs/WINDOWS_PHYSICAL_ACCEPTANCE_R1BD.md'
      - 'docs/WINDOWS_PHYSICAL_ACCEPTANCE_GUIDED.md'
      - 'docs/WINDOWS_STORE_IDENTITY_V1.md'
      - 'docs/WINDOWS_STORE_LOCAL_TEST_GUIDED.md'
      - 'scripts/*Physical-Acceptance*.ps1'
      - 'scripts/*Physical-Existing-Profile.ps1'
      - 'scripts/*Physical-Clean.ps1'
      - 'scripts/*Physical-Migration.ps1'
      - 'scripts/*Physical-Report-Runtime.ps1'
      - 'scripts/*Physical-Guide-Runtime.ps1'
      - 'scripts/*Windows-Store-Local-Test*.ps1'
      - 'scripts/windows-physical-*'
      - 'scripts/windows-store-local-test*'
      - 'scripts/verify-windows-store-local-test-report.mjs'
      - 'scripts/Test-Metrora-Windows-Release-Syntax.ps1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-physical-acceptance.yml'
      - 'AVVIA-TEST-FISICO-METRORA.cmd'
      - 'docs/WINDOWS_GITHUB_PRE_RELEASE_ACCEPTANCE_V1.md'
      - 'docs/WINDOWS_PHYSICAL_ACCEPTANCE_R1BD.md'
      - 'docs/WINDOWS_PHYSICAL_ACCEPTANCE_GUIDED.md'
      - 'docs/WINDOWS_STORE_IDENTITY_V1.md'
      - 'docs/WINDOWS_STORE_LOCAL_TEST_GUIDED.md'
      - 'scripts/*Physical-Acceptance*.ps1'
      - 'scripts/*Physical-Existing-Profile.ps1'
      - 'scripts/*Physical-Clean.ps1'
      - 'scripts/*Physical-Migration.ps1'
      - 'scripts/*Physical-Report-Runtime.ps1'
      - 'scripts/*Physical-Guide-Runtime.ps1'
      - 'scripts/*Windows-Store-Local-Test*.ps1'
      - 'scripts/windows-physical-*'
      - 'scripts/windows-store-local-test*'
      - 'scripts/verify-windows-store-local-test-report.mjs'
      - 'scripts/Test-Metrora-Windows-Release-Syntax.ps1'

permissions:
  contents: read

concurrency:
  group: metrora-physical-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report-and-candidate:
    name: Validate physical acceptance boundaries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'

      - name: Run physical acceptance native tests
        run: >-
          node --test
          scripts/windows-physical-acceptance-report.node-test.mjs
          scripts/windows-physical-candidate.node-test.mjs
          scripts/windows-store-local-test-report.node-test.mjs

  powershell-runtime:
    name: Validate physical acceptance PowerShell runtime
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'

      - name: Parse all Windows release and physical acceptance scripts
        shell: pwsh
        run: ./scripts/Test-Metrora-Windows-Release-Syntax.ps1 -RepositoryRoot $PWD

      - name: Exercise bounded context, report and sentinel runtime
        shell: pwsh
        run: ./scripts/Test-Metrora-Windows-Physical-Report-Runtime.ps1 -RepositoryRoot $PWD

      - name: Exercise guided phase and profile-boundary runtime
        shell: pwsh
        run: ./scripts/Test-Metrora-Windows-Physical-Guide-Runtime.ps1 -RepositoryRoot $PWD

      - name: Exercise Store local-test helpers
        shell: pwsh
        run: ./scripts/Test-Metrora-Windows-Store-Local-Test-Runtime.ps1 -RepositoryRoot $PWD

      - name: Exercise Store helpers under Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/Test-Metrora-Windows-Store-Local-Test-Runtime.ps1 -RepositoryRoot $PWD
