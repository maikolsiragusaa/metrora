name: Apply Metrora Rebrand

on:
  push:
    branches:
      - brand/metrora-rebrand
    paths:
      - 'scripts/rebrand/apply/**'
      - '.github/workflows/apply-metrora-rebrand.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-metrora-rebrand
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/metrora-rebrand
          fetch-depth: 0

      - name: Decode and apply
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/rebrand/apply/part-* | base64 -d | gzip -d > /tmp/metrora.patch
          git apply --check /tmp/metrora.patch
          git apply /tmp/metrora.patch
          rm -rf scripts/rebrand
          rm -f .github/workflows/apply-metrora-rebrand.yml
          node scripts/check-brand-boundary.mjs
          git diff --check

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "brand: complete Metrora rebrand with compatibility migration"
          git push origin HEAD:brand/metrora-rebrand
