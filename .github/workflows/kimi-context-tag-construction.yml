name: Kimi context-tag construction

on:
  push:
    branches: [fix/kimi-context-tag-pricing]

permissions:
  contents: write

concurrency:
  group: kimi-context-tag-construction
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kimi-context-tag-pricing
          fetch-depth: 0

      - name: Apply bounded production changes
        run: |
          python - <<'PY'
          from pathlib import Path

          models = Path('src/models.ts')
          text = models.read_text(encoding='utf-8')
          old = "const ONE_HOUR_CACHE_WRITE_MULTIPLIER_FROM_FIVE_MINUTE_RATE = 1.6\n"
          new = old + "export const PRICING_LOOKUP_VERSION = 'context-capacity-tags-v1'\n"
          if text.count(old) != 1:
              raise SystemExit('models.ts pricing constant anchor mismatch')
          text = text.replace(old, new)

          old = "    .replace(/^[^/]+\\//, '') // strip provider prefix: anthropic/foo -> foo\n"
          new = old + "    .replace(/\\[(?:\\d+(?:\\.\\d+)?(?:k|m|g)?)\\]$/i, '') // strip numeric context tag: kimi/k3[1m] -> k3\n"
          if text.count(old) != 1:
              raise SystemExit('models.ts canonicalization anchor mismatch')
          text = text.replace(old, new)

          old = "  const builtin = `builtin:${JSON.stringify(BUILTIN_PRICE_OVERRIDES)}`\n"
          new = "  const builtin = `lookup:${PRICING_LOOKUP_VERSION}\\u0001builtin:${JSON.stringify(BUILTIN_PRICE_OVERRIDES)}`\n"
          if text.count(old) != 1:
              raise SystemExit('models.ts pricing hash anchor mismatch')
          text = text.replace(old, new)
          models.write_text(text, encoding='utf-8')

          codex_cache = Path('src/codex-cache.ts')
          text = codex_cache.read_text(encoding='utf-8')
          old = "// v9: persist explicit per-call reasoning attribution from turn_context.\nconst CODEX_CACHE_VERSION = 9\n"
          new = "// v9: persist explicit per-call reasoning attribution from turn_context.\n// v10: reprice raw Codex model ids carrying numeric context-capacity tags.\nexport const CODEX_CACHE_VERSION = 10\n"
          if text.count(old) != 1:
              raise SystemExit('codex-cache.ts version anchor mismatch')
          codex_cache.write_text(text.replace(old, new), encoding='utf-8')

          session_cache = Path('src/session-cache.ts')
          text = session_cache.read_text(encoding='utf-8')
          old = "  codex: 'mcp-attribution-v5-est-cost-active-timing-mcp-wait-rich-capture-v1-cross-provider-pr-v1-reasoning-attribution-v1',\n"
          new = "  codex: 'mcp-attribution-v5-est-cost-active-timing-mcp-wait-rich-capture-v1-cross-provider-pr-v1-reasoning-attribution-v1-pricing-context-tags-v1',\n"
          if text.count(old) != 1:
              raise SystemExit('session-cache.ts Codex parser authority mismatch')
          session_cache.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Add focused pricing tests
        run: |
          cat > tests/kimi-context-tag-pricing.test.ts <<'EOF'
          import { afterEach, beforeAll, describe, expect, it } from 'vitest'

          import {
            PRICING_LOOKUP_VERSION,
            calculateCost,
            explicitZeroReasonForModel,
            getHistoricalPricingModelKey,
            getModelCosts,
            getPriceOverridesConfigHash,
            getShortModelName,
            loadPricing,
            setPriceOverrides,
          } from '../src/models.js'
          import { getDailyCacheConfigHash } from '../src/usage-aggregator.js'

          beforeAll(async () => {
            await loadPricing()
          })

          afterEach(() => {
            setPriceOverrides({})
          })

          describe('Kimi numeric context-tag normalization', () => {
            it('prices and displays tagged K3 ids through the canonical alias', () => {
              const canonical = getModelCosts('kimi-k3')
              expect(canonical).not.toBeNull()
              expect(getModelCosts('kimi/k3[1m]')).toEqual(canonical)
              expect(getModelCosts('k3[128k]')).toEqual(canonical)
              expect(calculateCost('kimi/k3[1m]', 1_000_000, 100_000, 0, 0, 0)).toBeGreaterThan(0)
              expect(getShortModelName('kimi/k3[1m]')).toBe('Kimi K3')
              expect(getHistoricalPricingModelKey('kimi/k3[1m]')).toBe('kimi-k3')
            })

            it('keeps an exact zero-rate override on the raw tagged id authoritative', () => {
              setPriceOverrides({
                'kimi/k3[1m]': { input: 0, output: 0, cacheRead: 0, cacheCreation: 0 },
              })

              expect(calculateCost('kimi/k3[1m]', 1_000_000, 100_000, 0, 0, 0)).toBe(0)
              expect(explicitZeroReasonForModel('kimi/k3[1m]')).toBe('manual-reviewed')
            })

            it('does not strip arbitrary descriptive bracket suffixes', () => {
              expect(getShortModelName('custom-model[preview]')).toBe('custom-model[preview]')
              expect(getModelCosts('custom-model[preview]')).toBeNull()
            })

            it('binds the daily accounting hash to the pricing lookup authority', () => {
              expect(getPriceOverridesConfigHash()).toContain(`lookup:${PRICING_LOOKUP_VERSION}`)
              expect(getDailyCacheConfigHash()).toContain(`lookup:${PRICING_LOOKUP_VERSION}`)
            })
          })
          EOF

      - name: Add Codex raw-evidence and stale-cache proof
        run: |
          cat > tests/codex-kimi-context-tag-cache.test.ts <<'EOF'
          import { afterAll, beforeEach, describe, expect, it, vi } from 'vitest'
          import { createHash } from 'crypto'
          import { mkdir, readFile, rm, writeFile } from 'fs/promises'
          import { join } from 'path'

          import { clearSessionCache, parseAllSessions } from '../src/parser.js'
          import { sessionCachePath } from '../src/session-cache.js'

          const testRoot = vi.hoisted(() => {
            const root = `${process.env['TMPDIR'] || '/tmp'}/codex-kimi-context-${process.pid}-${Date.now()}`
            process.env['HOME'] = `${root}/home`
            process.env['USERPROFILE'] = `${root}/home`
            process.env['CODEX_HOME'] = `${root}/codex`
            return root
          })

          const CODEX_HOME = join(testRoot, 'codex')
          const CACHE_DIR = join(testRoot, 'cache')
          const PREVIOUS_PARSE_VERSION = 'mcp-attribution-v5-est-cost-active-timing-mcp-wait-rich-capture-v1-cross-provider-pr-v1-reasoning-attribution-v1'

          function previousFingerprint(): string {
            return createHash('sha256')
              .update(`CODEX_HOME=${CODEX_HOME}\0parser=${PREVIOUS_PARSE_VERSION}`)
              .digest('hex')
              .slice(0, 16)
          }

          function allCalls(projects: Awaited<ReturnType<typeof parseAllSessions>>) {
            return projects
              .flatMap(project => project.sessions)
              .flatMap(session => session.turns)
              .flatMap(turn => turn.assistantCalls)
          }

          async function seedRollout(): Promise<void> {
            const dir = join(CODEX_HOME, 'sessions', '2026', '08', '05')
            await mkdir(dir, { recursive: true })
            const lines = [
              JSON.stringify({ type: 'session_meta', timestamp: '2026-08-05T10:00:00Z', payload: { session_id: 'sess-kimi-tag', model: 'kimi/k3[1m]', model_provider: 'kimi', cwd: '/Users/test/kimi', originator: 'codex_cli_rs' } }),
              JSON.stringify({ type: 'response_item', timestamp: '2026-08-05T10:00:10Z', payload: { type: 'message', role: 'user', content: [{ type: 'input_text', text: 'price the raw Kimi model' }] } }),
              JSON.stringify({ type: 'event_msg', timestamp: '2026-08-05T10:01:00Z', payload: { type: 'token_count', info: { model: 'kimi/k3[1m]', last_token_usage: { input_tokens: 1000, cached_input_tokens: 0, output_tokens: 100, reasoning_output_tokens: 0, total_tokens: 1100 }, total_token_usage: { input_tokens: 1000, cached_input_tokens: 0, output_tokens: 100, reasoning_output_tokens: 0, total_tokens: 1100 } } } }),
            ]
            await writeFile(join(dir, 'rollout-kimi-tag.jsonl'), lines.join('\n') + '\n')
          }

          beforeEach(async () => {
            process.env['HOME'] = join(testRoot, 'home')
            process.env['USERPROFILE'] = join(testRoot, 'home')
            process.env['CODEX_HOME'] = CODEX_HOME
            process.env['CODEBURN_CACHE_DIR'] = CACHE_DIR
            clearSessionCache()
            await rm(testRoot, { recursive: true, force: true })
            await seedRollout()
          })

          afterAll(async () => {
            clearSessionCache()
            await rm(testRoot, { recursive: true, force: true })
          })

          describe('Codex Kimi context-tag cache reconciliation', () => {
            it('preserves the raw model while rejecting stale zero-cost caches', async () => {
              const freshCalls = allCalls(await parseAllSessions(undefined, 'codex'))
              expect(freshCalls).toHaveLength(1)
              expect(freshCalls[0]!.model).toBe('kimi/k3[1m]')
              expect(freshCalls[0]!.costUSD).toBeGreaterThan(0)

              const cachePath = sessionCachePath()
              const cache = JSON.parse(await readFile(cachePath, 'utf8'))
              cache.providers.codex.envFingerprint = previousFingerprint()
              for (const file of Object.values(cache.providers.codex.files) as any[]) {
                for (const turn of file.turns ?? []) {
                  for (const call of turn.calls ?? []) {
                    call.costUSD = 0
                    call.costAssignment = { version: 1, kind: 'unavailable', reason: 'no-price-record' }
                  }
                }
              }
              await writeFile(cachePath, JSON.stringify(cache))

              const codexCachePath = join(CACHE_DIR, 'codex-results.json')
              const codexCache = JSON.parse(await readFile(codexCachePath, 'utf8'))
              codexCache.version = 9
              for (const file of Object.values(codexCache.files) as any[]) {
                for (const call of file.calls ?? []) call.costUSD = 0
              }
              await writeFile(codexCachePath, JSON.stringify(codexCache))

              clearSessionCache()
              const reparsedCalls = allCalls(await parseAllSessions(undefined, 'codex'))
              expect(reparsedCalls).toHaveLength(1)
              expect(reparsedCalls[0]!.model).toBe('kimi/k3[1m]')
              expect(reparsedCalls[0]!.costUSD).toBeGreaterThan(0)
              expect(reparsedCalls[0]!.costAssignment?.kind).not.toBe('unavailable')
            })
          })
          EOF

      - name: Remove construction workflow and commit
        run: |
          set -euo pipefail
          rm .github/workflows/kimi-context-tag-construction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/models.ts src/codex-cache.ts src/session-cache.ts tests/kimi-context-tag-pricing.test.ts tests/codex-kimi-context-tag-cache.test.ts .github/workflows/kimi-context-tag-construction.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/kimi-context-tag-construction.yml\nsrc/codex-cache.ts\nsrc/models.ts\nsrc/session-cache.ts\ntests/codex-kimi-context-tag-cache.test.ts\ntests/kimi-context-tag-pricing.test.ts'
          git commit -m 'fix(pricing): resolve Kimi context-capacity tags'
          git push origin HEAD:fix/kimi-context-tag-pricing