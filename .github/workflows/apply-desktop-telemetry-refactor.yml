name: Apply desktop telemetry refactor

on:
  push:
    branches:
      - refactor/desktop-telemetry-controller
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/desktop-telemetry-controller
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Connect App shell to telemetry controller
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('app/renderer/App.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { useCallback, useEffect, useMemo, useRef, useState } from 'react'\n",
              "import { useCallback, useEffect, useMemo, useState } from 'react'\n",
          )
          replace_once(
              "import { useDesktopScope } from './hooks/useDesktopScope'\n"
              "import { useDesktopShortcuts } from './hooks/useDesktopShortcuts'\n",
              "import { useDesktopScope } from './hooks/useDesktopScope'\n"
              "import { useDesktopShortcuts } from './hooks/useDesktopShortcuts'\n"
              "import { useDesktopTelemetry } from './hooks/useDesktopTelemetry'\n",
          )
          replace_once("import { codeburn } from './lib/ipc'\n", "")
          replace_once(
              "import type { MenubarPayload, ModelReportRow, TelemetryStatus } from './lib/types'\n",
              "import type { MenubarPayload } from './lib/types'\n",
          )
          replace_once(
              "export { overviewMemoKey } from './hooks/useProviderPrefetch'\n",
              "export { overviewMemoKey } from './hooks/useProviderPrefetch'\n"
              "export { topCategoryByModel, usageSnapshotProps } from './hooks/useDesktopTelemetry'\n",
          )

          start = text.index("// Bucket raw dollar amounts before they leave the machine")
          end = text.index("function refreshedLabel", start)
          text = text[:start] + text[end:]

          old = """  // First-launch onboarding: shown until the telemetry consent screen has been
  // completed once. All telemetry bridge calls are typeof-guarded so an older
  // preload (or the test bridge mock) degrades to \"no onboarding, no tracking\".
  const [onboardingStatus, setOnboardingStatus] = useState<TelemetryStatus | null>(null)
  useEffect(() => {
    if (typeof codeburn.telemetryStatus !== 'function') return
    codeburn.telemetryStatus()
      .then(status => { if (status && !status.onboarded) setOnboardingStatus(status) })
      .catch(() => { /* telemetry unavailable — skip onboarding */ })
  }, [])
  const finishOnboarding = useCallback((enabled: boolean) => {
    setOnboardingStatus(null)
    if (typeof codeburn.completeOnboarding === 'function') void codeburn.completeOnboarding(enabled).catch(() => {})
  }, [])

  const trackEvent = useCallback((name: string, props?: Record<string, unknown>) => {
    if (typeof codeburn.telemetryTrack === 'function') void codeburn.telemetryTrack(name, props).catch(() => {})
  }, [])

  // Once-per-day anonymous usage aggregate, only from the canonical view
  // (all providers, standard period, no config scope) so buckets are stable.
  // Gated to the first qualifying render per calendar day so the extra by-model
  // report fetch runs at most once/day, not on every poll (main also dedups the
  // event). The fetch enriches each model with its dominant task category; if it
  // fails we still emit the snapshot, just without the model x category cross.
  const snapshotDayRef = useRef<string | null>(null)
  useEffect(() => {
    if (!overview.data || provider !== 'all' || customRange || scopedClaudeConfigSource) return
    const today = localDateKey(new Date())
    if (snapshotDayRef.current === today) return
    snapshotDayRef.current = today
    const payload = overview.data
    void (async () => {
      let modelCategories: Map<string, string> | undefined
      try {
        modelCategories = topCategoryByModel(await codeburn.getModels(period, 'all', false))
      } catch { /* degrade: emit the snapshot without per-model topCategory */ }
      trackEvent('usage_snapshot', usageSnapshotProps(payload, modelCategories))
    })()
  }, [overview.data, provider, customRange, scopedClaudeConfigSource, period, trackEvent])

"""
          new = """  const { onboardingStatus, finishOnboarding, trackEvent } = useDesktopTelemetry({
    overviewData: overview.data,
    period,
    provider,
    customRange,
    scopedClaudeConfigSource,
  })

"""
          replace_once(old, new)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix app ci

      - name: Run focused desktop validation
        run: |
          npm --prefix app test -- renderer/hooks/useDesktopTelemetry.test.tsx renderer/App.test.tsx
          npm --prefix app run typecheck
          npm --prefix app run build:renderer

      - name: Commit final refactor without helper workflow
        shell: bash
        run: |
          git config user.name "Metrora Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-desktop-telemetry-refactor.yml
          git add app/renderer/App.tsx app/renderer/hooks/useDesktopTelemetry.ts app/renderer/hooks/useDesktopTelemetry.test.tsx
          git commit -m "refactor(desktop): extract telemetry controller"
          git push origin HEAD:refactor/desktop-telemetry-controller
