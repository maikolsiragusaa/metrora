name: Apply Metrora Rebrand

on:
  pull_request:
    branches:
      - main
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-metrora-rebrand
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    name: Apply verified Metrora rebrand
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/metrora-rebrand
          fetch-depth: 0

      - name: Decode, verify and apply
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            scripts/rebrand/apply/part-00-00
            scripts/rebrand/apply/part-00-01
            scripts/rebrand/apply/part-00-02
            scripts/rebrand/apply/part-00-03
            scripts/rebrand/apply/part-00-04
            scripts/rebrand/apply/part-01
            scripts/rebrand/apply/part-02
            scripts/rebrand/apply/part-03
            scripts/rebrand/apply/part-04
            scripts/rebrand/apply/part-05
            scripts/rebrand/apply/part-06-00
            scripts/rebrand/apply/part-06-01
            scripts/rebrand/apply/part-06-02
            scripts/rebrand/apply/part-06-03
            scripts/rebrand/apply/part-06-04
            scripts/rebrand/apply/part-06-05
            scripts/rebrand/apply/part-06-06
            scripts/rebrand/apply/part-06-07
            scripts/rebrand/apply/part-06-08
          )
          cat "${parts[@]}" > /tmp/metrora.patch.gz.b64
          test "$(wc -c < /tmp/metrora.patch.gz.b64)" -eq 76056
          echo '99f779d14dda52a7350dda67ee8b58903673ffdfccdff088cb2f8162aaaac964  /tmp/metrora.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/metrora.patch.gz.b64 | gzip --decompress > /tmp/metrora.patch
          echo '9a33d1e6c1206e5301aba35c980d43a8f3e9bb2291543579ae4ad9683c80e706  /tmp/metrora.patch' | sha256sum --check
          git apply --check --exclude=.github/workflows/metrora-rebrand-inventory.yml /tmp/metrora.patch
          git apply --exclude=.github/workflows/metrora-rebrand-inventory.yml /tmp/metrora.patch
          rm -rf scripts/rebrand
          rm -f .github/workflows/apply-metrora-rebrand.yml
          rm -f .github/workflows/metrora-rebrand-inventory.yml
          node scripts/check-brand-boundary.mjs
          git diff --check

      - name: Commit completed rebrand
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "brand: complete Metrora rebrand with compatibility migration"
          git push origin HEAD:brand/metrora-rebrand
