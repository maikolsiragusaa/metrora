name: QOV-002 verified finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/qov-002-finalize.mjs
      - .github/workflows/qov-002-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply deterministic migration
        run: node scripts/qov-002-finalize.mjs

      - name: Refresh root lock metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate core
        run: |
          npm ci --no-audit --no-fund
          npm run build:cli
          npm test -- --run

      - name: Validate desktop
        run: |
          npm --prefix app ci --no-audit --no-fund
          npm --prefix app test
          npm --prefix app run typecheck
          npm --prefix app run build

      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No migration diff to commit.'
            exit 0
          fi
          git config user.name 'Maikol Siragusa'
          git config user.email '268940776+maikolsiragusaa@users.noreply.github.com'
          git add app src package-lock.json
          git commit -m 'feat: complete Qovrion compatibility migration'
          git push origin HEAD:${{ github.head_ref }}
