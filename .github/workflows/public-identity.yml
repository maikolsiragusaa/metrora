name: Metrora Public Identity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: metrora-public-identity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    name: Public identity boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
      - name: Reject personal and private project identities
        run: npm run identity:public:check
