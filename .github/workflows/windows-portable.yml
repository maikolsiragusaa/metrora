name: Metrora Windows Portable

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Candidate classification
        required: true
        default: unsigned-development-artifact
        type: choice
        options:
          - unsigned-development-artifact
          - unsigned-release-candidate
  pull_request:
    paths:
      - '.github/workflows/windows-portable.yml'
      - 'app/**'
      - 'src/**'
      - 'scripts/**'
      - 'release/**'
      - 'tools/windows-portable/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-portable.yml'
      - 'app/**'
      - 'src/**'
      - 'scripts/**'
      - 'release/**'
      - 'tools/windows-portable/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: metrora-windows-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Build, inventory, and smoke-test portable bundle
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm

      - name: Test release manifest integrity library
        run: node --test scripts/windows-release-manifest.node-test.mjs

      - name: Require Node zstd support
        run: node -e "if (typeof require('node:zlib').zstdDecompressSync !== 'function') throw new Error('Node zstd support is required')"

      - name: Install core dependencies
        run: npm ci --no-audit --no-fund

      - name: Install desktop dependencies
        run: npm --prefix app ci --no-audit --no-fund

      - name: Stage bundled CLI
        run: npm --prefix app run stage-cli

      - name: Build desktop application
        run: npm --prefix app run build

      - name: Build unpacked Windows application
        shell: pwsh
        run: |
          Push-Location app
          npx --no-install electron-builder --win --x64 --dir --publish never
          Pop-Location

      - name: Assemble portable candidate payload
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'app\release\win-unpacked'
          $destination = Join-Path $PWD 'app\release\Metrora-Windows-Portable'
          if (-not (Test-Path -LiteralPath (Join-Path $source 'Metrora.exe'))) {
            throw "electron-builder did not produce $source\Metrora.exe"
          }

          Remove-Item -LiteralPath $destination -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $destination -Recurse -Force
          Copy-Item -LiteralPath 'tools\windows-portable\Run-Metrora-Baseline.ps1' -Destination $destination -Force
          Copy-Item -LiteralPath 'tools\windows-portable\Run-Metrora-Baseline.cmd' -Destination $destination -Force
          Copy-Item -LiteralPath 'tools\windows-portable\README.txt' -Destination $destination -Force

      - name: Generate deterministic payload manifest and build attestation
        shell: pwsh
        run: |
          $destination = Join-Path $PWD 'app\release\Metrora-Windows-Portable'
          $sourceTree = (git rev-parse "$env:GITHUB_SHA^{tree}").Trim()
          $sourceEpoch = (git show -s --format=%ct $env:GITHUB_SHA).Trim()
          $distribution = '${{ inputs.distribution }}'
          if (-not $distribution) { $distribution = 'unsigned-development-artifact' }
          $runnerImage = "$env:ImageOS/$env:ImageVersion"
          $builtAt = [DateTime]::UtcNow.ToString('o')

          node scripts/create-windows-release-manifest.mjs `
            --bundle $destination `
            --source-commit $env:GITHUB_SHA `
            --source-tree $sourceTree `
            --source-date-epoch $sourceEpoch `
            --distribution $distribution `
            --provider github-actions `
            --workflow $env:GITHUB_WORKFLOW `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --ref $env:GITHUB_REF `
            --built-at $builtAt `
            --runner-os windows `
            --runner-image $runnerImage

      - name: Verify candidate locally before upload
        shell: pwsh
        run: node scripts/verify-windows-release-manifest.mjs app/release/Metrora-Windows-Portable --expected-commit $env:GITHUB_SHA

      - name: Smoke-test bundled CLI and baseline runner
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'app\release\Metrora-Windows-Portable'
          $smokeOutput = Join-Path $env:RUNNER_TEMP 'metrora-baseline-smoke'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $bundle 'Run-Metrora-Baseline.ps1') `
            -OutputDirectory $smokeOutput `
            -SkipCodeBurn `
            -SkipPrivateCacheBackup `
            -NoArchive
          if ($LASTEXITCODE -ne 0) { throw 'portable baseline runner failed' }

          $version = Get-Content -LiteralPath (Join-Path $smokeOutput 'metrora-version.txt') -Raw
          if (-not $version.Trim()) { throw 'bundled CLI version output is empty' }
          $manifest = Get-Content -LiteralPath (Join-Path $smokeOutput 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.schemaVersion -ne 1) { throw 'unexpected baseline manifest schema' }
          Get-Content -LiteralPath (Join-Path $smokeOutput 'metrora-report-lifetime.json') -Raw | ConvertFrom-Json | Out-Null
          Get-Content -LiteralPath (Join-Path $smokeOutput 'metrora-doctor.json') -Raw | ConvertFrom-Json | Out-Null

          $overviewPath = Join-Path $smokeOutput 'metrora-overview-lifetime.txt'
          $overview = [System.IO.File]::ReadAllText($overviewPath, [System.Text.Encoding]::UTF8)
          if ($overview -notmatch '^Metrora\s+Lifetime') {
            throw 'portable overview does not expose the canonical Metrora heading'
          }
          if ($overview -match '\bCodeBurn\b') {
            throw 'portable overview leaked legacy CodeBurn branding'
          }
          if ($overview.Contains('Ô')) {
            throw 'portable overview contains Windows encoding mojibake'
          }

      - name: Upload portable Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: metrora-windows-portable-${{ github.sha }}
          path: app/release/Metrora-Windows-Portable
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 6
          retention-days: 14

  independent-verification:
    name: Independently verify downloaded candidate
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'

      - uses: actions/download-artifact@v4
        with:
          name: metrora-windows-portable-${{ github.sha }}
          path: candidate

      - name: Verify every downloaded payload and metadata file
        run: node scripts/verify-windows-release-manifest.mjs candidate --expected-commit ${{ github.sha }}
