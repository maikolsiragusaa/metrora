name: Architecture boundaries

on:
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - 'config/source-size-baseline.json'
      - '.github/workflows/architecture-boundaries.yml'
  push:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - 'config/source-size-baseline.json'
      - '.github/workflows/architecture-boundaries.yml'

permissions:
  contents: read

jobs:
  source-size-ratchet:
    name: Source size ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Prevent new or growing GOD FILES
        run: node scripts/check-source-size-ratchet.mjs
